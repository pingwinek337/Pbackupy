name: Build PBackup
 
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
 
      - name: Zainstaluj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Zbuduj plugin (Maven)
        run: mvn -B -ntp clean package
 
      - name: Wyślij JAR jako artefakt (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PBackup
          path: target/PBackup.jar
          if-no-files-found: error
 
      - name: Opublikuj JAR w Releases (bezpośrednie pobranie, bez zipa)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PBackup build ${{ github.run_number }}
          files: target/PBackup.jar
          generate_release_notes: true
 
